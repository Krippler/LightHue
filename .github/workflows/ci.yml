name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        # Stamped the way the publish workflow stamps it, so the check below
        # proves the version makes it from build arg to the running app.
        run: docker build --build-arg LIGHTHUE_VERSION=ci-stamp -t lighthue:ci .

      - name: Boot the container and hit it
        run: |
          docker run -d --name ci-console -p 26000:26000 lighthue:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:26000/api/bridge > /dev/null; then
              echo "console is up"
              curl -fsS http://127.0.0.1:26000/api/auth
              echo
              # The version, in the API and first in the log.
              curl -fsS http://127.0.0.1:26000/api/version | grep -q '"version":"ci-stamp"' \
                || { echo "the build stamp did not reach the app"; docker logs ci-console; docker rm -f ci-console; exit 1; }
              docker logs ci-console 2>&1 | head -n 1 | grep -qx 'LightHue ci-stamp' \
                || { echo "the log does not open with the version"; docker logs ci-console; docker rm -f ci-console; exit 1; }
              # The health endpoint and the HEALTHCHECK that drives it: this is
              # the only place either runs in a real container.
              curl -fsS http://127.0.0.1:26000/api/health
              echo
              for _ in $(seq 1 30); do
                status=$(docker inspect -f '{{.State.Health.Status}}' ci-console)
                echo "health: $status"
                [ "$status" = "healthy" ] && break
                [ "$status" = "unhealthy" ] && { docker logs ci-console; docker rm -f ci-console; exit 1; }
                sleep 2
              done
              [ "$status" = "healthy" ] || { docker logs ci-console; docker rm -f ci-console; exit 1; }
              docker rm -f ci-console
              exit 0
            fi
            sleep 1
          done
          echo "console did not come up in time"
          docker logs ci-console
          docker rm -f ci-console
          exit 1
